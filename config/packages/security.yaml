security:
    password_hashers:
        App\Entity\OwnerUser: 'auto'

    providers:
        owner_users:
            entity:
                class: App\Entity\OwnerUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: owner_users
            form_login:
                login_path: locals_login
                check_path: locals_login
                enable_csrf: true
                default_target_path: locals_dashboard
            logout:
                path: locals_logout
                target: locals_login
            custom_authenticator: App\Security\GoogleAuthenticator

    access_control:
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_OWNER_USER }

when@test:
    security:
        password_hashers:
            App\Entity\OwnerUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
